<title>NorthPole Inc. Adviento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=Gluten:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Layout: barra de prototipo + cabecera con guirnalda + 4 pantallas (calendario, ticket, perfil, cómo funciona).
   Tres variantes del diseño acogedor (postales, puertas, estantería); ocho paletas navideñas que redefinen los mismos tokens. */
:root{
  --bg:#FAF4E8; --surface:#FFFCF6; --surface-2:#F1E5D1; --fg:#2A2017; --muted:#6C5C4C; --line:#E3D3BB;
  --primary:#A3302A; --primary-fg:#FFF8EE; --primary-deep:#7C2420; --accent:#2E5B45; --accent-fg:#FFFFFF;
  --ok:#2E7A4F; --warn:#B97A22; --lock:#B3A28B; --wood:#8C5B36; --glow:#F5C35A; --snow:#FFFFFF; --star:#C98A14;
  --sky-a:#24395A; --sky-b:#5E7FA6; --ill-red:#C8352F; --ill-green:#2F6B4A; --ill-gold:#F2B73F; --ill-ink:#2A2017;
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm:8px; --r:14px; --r-lg:20px;
}
:root[data-design="puertas"]{ --font-display:"Caprasimo", Georgia, serif; --r-sm:6px; --r:10px; --r-lg:16px; }
:root[data-design="estanteria"]{ --font-display:"Gluten", "Figtree", system-ui, sans-serif; --r-sm:10px; --r:18px; --r-lg:24px; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;transition:background-color .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
:root[data-design="estanteria"] :is(h1,h2,h3){font-weight:700}
p{margin:0}
a{color:inherit}
code{font-family:var(--font-mono);font-size:.9em}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ico{display:inline-flex;width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}
.ico svg{width:100%;height:100%}
.star{color:var(--star)}

/* Barra del prototipo */
.proto{background:var(--surface-2);border-bottom:1px solid var(--line);font-family:"Figtree",system-ui,sans-serif;font-size:13px;color:var(--muted)}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.proto strong{color:var(--fg);font-weight:700;margin-right:auto}
.proto label{display:flex;align-items:center;gap:6px}
.proto select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.swatches{display:flex;gap:4px}
.swatches span{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}

/* Cabecera con guirnalda */
.app-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.app-header::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;pointer-events:none;
  background:
   radial-gradient(circle at 12px 9px,var(--glow) 4px,transparent 4.5px) 0 0/56px 16px,
   radial-gradient(circle at 40px 9px,var(--ill-red) 4px,transparent 4.5px) 0 0/56px 16px,
   linear-gradient(var(--line),var(--line)) 0 8px/100% 1.5px no-repeat}
.app-header .wrap{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--font-display);font-size:20px;color:var(--fg);white-space:nowrap}
:root[data-design="estanteria"] .logo{font-weight:700}
.logo-mark{width:24px;height:24px;fill:var(--primary)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tab{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--primary-fg);background:var(--primary)}
.me-chip{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;text-decoration:none;color:var(--fg);white-space:nowrap}
.score{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
@media (max-width:760px){.tabs{order:3;flex-basis:100%}.me-chip,.app-header .btn{margin-left:auto}}

.ini{width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:calc(var(--s) * .38);font-family:var(--font-body);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--glow)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:700 15px/1.2 var(--font-body);padding:.8em 1.3em;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .12s, background-color .15s}
.btn-sm{font-size:14px;padding:.6em 1.1em}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:var(--primary-deep)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.btn-link{background:none;border:0;padding:4px;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}

/* Botones de acceso (colores de cada proveedor) */
.oauth{display:flex;flex-direction:column;gap:10px}
.oauth-row{flex-direction:row;flex-wrap:wrap}
.oauth-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 15px/1.2 var(--font-body);padding:.75em 1.2em;border-radius:999px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.oauth-btn svg{width:20px;height:20px;flex:none}
.oauth-btn.gh{background:#24292F;color:#FFFFFF}
.oauth-btn.gh:hover{background:#000000}
.oauth-btn.gg{background:#FFFFFF;color:#1F1F1F;border-color:#DADCE0}
.oauth-btn.gg:hover{background:#F6F8FC}
.oauth-row .oauth-btn{font-size:14px;padding:.6em 1em}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;min-width:0;box-shadow:0 2px 0 var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.t-api{--tc:var(--primary)} .t-ia{--tc:var(--accent)} .t-algo{--tc:var(--wood)} .t-datos{--tc:var(--muted)} .t-mini{--tc:var(--glow)}

/* Etiquetas de dificultad: color + texto + puntos (iguales en todas las paletas) */
.lvl{display:inline-flex;align-items:center;gap:6px;font:800 11.5px/1 var(--font-body);padding:5px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.lvl-1{background:#9BE3A5;color:#0E3A18}
.lvl-2{background:#FFD36B;color:#4A3000}
.lvl-3{background:#FF8F86;color:#5A0D0D}
.lvl-0{background:#C9D4FF;color:#1C2A66}
.pips{display:inline-flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28}
.pips i.on{opacity:1}
.lvl-legend{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--muted)}
.lvl-legend li{display:flex;gap:8px;align-items:center}

/* Pantallas */
.screen{padding-block:36px 72px}
.screen-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.screen-head h1{font-size:clamp(1.9rem,3.8vw,2.7rem)}
.screen-head p{margin-top:6px}
.stats{display:flex;gap:8px 28px;flex-wrap:wrap;margin:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.login-inline{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* Ilustración de cada día */
.tile-art{position:absolute;inset:0;overflow:hidden;background:var(--tb);container-type:size}
.tile-art::before{content:"";position:absolute;inset:0;opacity:.75;
  background:
   radial-gradient(circle,var(--snow) 1.3px,transparent 1.8px) 0 0/29px 31px,
   radial-gradient(circle,var(--snow) 1px,transparent 1.5px) 13px 17px/41px 37px}
.tile-art::after{content:"";position:absolute;left:-18%;right:-18%;bottom:-24%;height:42%;border-radius:50%;background:var(--snow)}
.bg-n{--tb:linear-gradient(180deg,var(--sky-a),var(--sky-b))}
.bg-g{--tb:linear-gradient(180deg,color-mix(in srgb,var(--ill-green) 65%,var(--ill-ink)),var(--ill-green))}
.bg-r{--tb:linear-gradient(180deg,color-mix(in srgb,var(--ill-red) 70%,var(--ill-ink)),var(--ill-red))}
.bg-c{--tb:linear-gradient(180deg,var(--surface-2),var(--surface))}
.bg-c::before{display:none}
.tile-art.photo{background:var(--surface-2)}
.tile-art.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile-art.photo::before{opacity:1;z-index:1;background:linear-gradient(to bottom,color-mix(in srgb,var(--ill-ink) 50%,transparent),transparent 34%,transparent 66%,color-mix(in srgb,var(--ill-ink) 45%,transparent))}
.tile-art.photo::after{display:none}
.credits summary{cursor:pointer;font-weight:700;font-size:15px}
.credits p{margin-top:10px}
.credits ul{columns:2;column-gap:32px;margin:12px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.credits li{break-inside:avoid;margin-bottom:4px}
@media (max-width:640px){.credits ul{columns:1}}
.bg-c::after{background:color-mix(in srgb,var(--snow) 70%,var(--surface-2));box-shadow:inset 0 2px 0 var(--line)}
.ill{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);height:min(74cqh,84cqw);width:auto;aspect-ratio:1;z-index:1;overflow:visible}
.ill-wide{aspect-ratio:3/1;height:min(78cqh,26cqw);left:auto;right:3%;transform:none}
.ill .o{stroke:var(--ill-ink);stroke-width:2.4;stroke-linejoin:round}
.ill .r{fill:var(--ill-red)} .ill .g{fill:var(--ill-green)} .ill .y{fill:var(--ill-gold)} .ill .s{fill:var(--snow)} .ill .k{fill:var(--ill-ink)} .ill .w{fill:var(--wood)}
.ill .ys{fill:none;stroke:var(--ill-gold);stroke-width:4.5;stroke-linecap:round}
.ill .ss{fill:none;stroke:var(--snow);stroke-width:4;stroke-linecap:round}
.ill .ss2{fill:none;stroke:var(--snow);stroke-width:2.6;stroke-linecap:round}
.ill .rs{fill:none;stroke:var(--ill-red);stroke-width:6;stroke-linecap:round}
.ill .gs{fill:none;stroke:var(--ill-green);stroke-width:14}
.ill .ws{fill:none;stroke:var(--wood);stroke-width:4.5;stroke-linecap:round}
.ill .ks{fill:none;stroke:var(--ill-ink);stroke-width:16;stroke-linecap:round}
.ill .sc{fill:none;stroke:var(--snow);stroke-width:11;stroke-linecap:round}
.ill .rc{fill:none;stroke:var(--ill-red);stroke-width:11;stroke-dasharray:6 8}
.ill .ol *{fill:var(--ill-ink);stroke:var(--ill-ink);stroke-width:5}
.ill .fw *{fill:var(--wood)}
.tile-n{position:absolute;top:8px;left:8px;z-index:2;min-width:36px;height:36px;padding:0 9px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--ill-ink) 62%,transparent);color:var(--snow);font:400 21px/1 var(--font-display);font-variant-numeric:tabular-nums}
:root[data-design="estanteria"] .tile-n{font-weight:700}
.tile-lvl{position:absolute;top:10px;right:10px;z-index:2}

/* Variante: postales */
.post-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(130px,13.5vw,168px);gap:14px}
.tile{position:relative;display:block;border:0;padding:0;margin:0;font:inherit;text-align:left;cursor:pointer;text-decoration:none;color:var(--snow);border-radius:var(--r);overflow:hidden;background:var(--surface-2);
  box-shadow:0 0 0 4px var(--surface),0 10px 22px -12px color-mix(in srgb,var(--fg) 60%,transparent);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile-cap{position:absolute;right:8px;bottom:8px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:800;line-height:1;background:color-mix(in srgb,var(--ill-ink) 70%,transparent);color:var(--snow)}
.tile-cap .star{white-space:nowrap}
.sp-big{grid-column:span 2;grid-row:span 2}
.sp-big .tile-n{font-size:30px;height:46px;min-width:46px}
.sp-big .tile-cap{font-size:15px}
.sp-tall{grid-row:span 2}
.sp-wide{grid-column:span 2}
.sp-banner{grid-column:1/-1}
.banner-txt{position:absolute;left:24px;top:50%;transform:translateY(-50%);z-index:2;color:var(--snow);max-width:46%}
.banner-txt b{display:block;font:400 clamp(26px,3.6vw,44px)/1.05 var(--font-display)}
:root[data-design="estanteria"] .banner-txt b{font-weight:700}
.banner-txt span{font-size:14px;opacity:.9}
.is-hoy{box-shadow:0 0 0 4px var(--glow),0 0 34px 4px color-mix(in srgb,var(--glow) 70%,transparent)}
.is-bloqueado .tile-art,.is-bloqueado .door-art{filter:grayscale(1) brightness(.9);opacity:.5}
.is-bloqueado:hover{transform:none}
.sponsor{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;padding:16px;background:var(--surface);color:var(--fg)}
.sponsor small{color:var(--muted);font-size:12.5px}
@media (max-width:1000px){.post-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:150px}}
@media (max-width:640px){
  .post-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;grid-auto-rows:156px;gap:12px}
  .sp-big{grid-row:auto}.d18{grid-column:auto}.sp-tall{grid-row:auto}.d9{grid-column:auto}.sp-banner{grid-column:auto}
  .sp-big .tile-n{font-size:21px;height:36px;min-width:36px}
  .banner-txt{display:none}
  .ill-wide{right:50%;transform:translateX(50%)}
}

/* Molero, patrocinador */
.molero{display:inline-flex;align-items:center;gap:10px;font:400 34px/1 "Caprasimo", Georgia, serif;color:var(--fg)}
.molero-mark{width:38px;height:38px;border-radius:11px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:24px}

/* Variante: puertas */
.lights{height:30px;margin-bottom:8px;background:
   radial-gradient(circle at 14px 18px,var(--glow) 6px,transparent 6.5px) 0 0/60px 30px,
   radial-gradient(circle at 44px 18px,var(--ill-red) 6px,transparent 6.5px) 0 0/60px 30px,
   linear-gradient(var(--line),var(--line)) 0 11px/100% 2px no-repeat}
.door-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.door{position:relative;aspect-ratio:3/4;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none;border-radius:var(--r);background:var(--wood);color:var(--snow);overflow:hidden;
  box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--wood) 68%,var(--ill-ink)),0 6px 0 color-mix(in srgb,var(--wood) 60%,var(--ill-ink));transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door::before,.door::after{content:"";position:absolute;left:14%;right:14%;border-radius:6px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--wood) 72%,var(--ill-ink))}
.door::before{top:16%;bottom:38%}
.door::after{top:68%;bottom:9%}
.door-motif{position:absolute;left:50%;top:41%;width:50%;transform:translate(-50%,-50%);z-index:1}
.door-lock{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);width:30%;color:color-mix(in srgb,var(--wood) 55%,var(--snow));z-index:1}
.door .tile-n{background:color-mix(in srgb,var(--ill-ink) 45%,transparent);font-size:19px;height:32px;min-width:32px}
.door .tile-lvl{top:9px;right:8px}
.door .tile-lvl .lvl{font-size:10.5px;padding:4px 7px}
.door-foot{position:absolute;left:0;right:0;bottom:12%;z-index:2;text-align:center;font-weight:800;font-size:13px}
.door-knob{position:absolute;right:9%;top:55%;width:9px;height:9px;border-radius:50%;background:var(--glow);z-index:2}
.door.is-hecho{background:var(--surface-2)}
.door.is-hecho::before,.door.is-hecho::after{display:none}
.door-art{position:absolute;inset:0}
.door-panel{position:absolute;left:0;top:0;bottom:0;width:15%;background:var(--wood);transform:skewY(-14deg);transform-origin:top left;z-index:2;box-shadow:inset -3px 0 0 color-mix(in srgb,var(--wood) 65%,var(--ill-ink))}
.door.is-hecho .door-foot{bottom:0;padding:22px 6px 8px;background:linear-gradient(to top,color-mix(in srgb,var(--ill-ink) 85%,transparent),transparent)}
.door.is-hoy{box-shadow:inset 0 0 0 4px var(--glow),0 0 0 4px var(--glow),0 0 34px 4px color-mix(in srgb,var(--glow) 70%,transparent)}
.door.is-bloqueado{background:color-mix(in srgb,var(--wood) 80%,var(--bg))}
.plaque{margin:36px auto 0;max-width:560px;text-align:center;background:var(--surface);border:3px solid var(--wood);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
@media (max-width:900px){.door-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.door-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.door .tile-lvl{display:none}}

/* Variante: estantería por semanas */
.shelf{margin-bottom:36px}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px}
.shelf-head h2{font-size:24px}
.shelf-row{display:flex;gap:16px;overflow-x:auto;padding:6px 6px 0;scroll-snap-type:x proximity}
.shelf-board{height:16px;background:var(--wood);border-radius:4px;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--wood) 70%,var(--ill-ink)),0 10px 16px -10px color-mix(in srgb,var(--fg) 70%,transparent)}
.book{flex:0 0 170px;scroll-snap-align:start;border:0;padding:0 0 12px;background:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.book-art{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 3px var(--surface);transition:transform .15s}
.book:hover .book-art{transform:translateY(-3px)}
.book-title{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-meta{font-size:12.5px;color:var(--muted);margin-top:-4px}
.book.is-hoy .book-art{box-shadow:0 0 0 4px var(--glow),0 0 28px 4px color-mix(in srgb,var(--glow) 70%,transparent)}
.book.is-hecho .book-meta{color:var(--ok);font-weight:700}
.book.is-pendiente .book-meta{color:var(--warn);font-weight:700}
.book.is-bloqueado .book-art .tile-art{filter:grayscale(1) brightness(.9);opacity:.5}
.book-plain{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding:12px;background:var(--surface)}

/* Cómo funciona */
.hero{padding-block:52px 56px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.6rem);max-width:15ch;letter-spacing:-.01em}
.lede{font-size:18px;color:var(--muted);max-width:54ch;margin-top:18px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--muted);font-size:14px}
.facts b{color:var(--fg)}
.mosaic{position:relative;height:380px;max-width:480px;width:100%;margin-inline:auto}

  function footer() {

  const oauthButtons = (row) => `<div class="oauth${row ? " oauth-row" : ""}"><button type="button" class="oauth-btn gh" data-action="oauth" data-prov="GitHub">${GH}Entrar con GitHub</button></div>`;

  /* ---------- Calendario ---------- */
  function calHead() {
    const [bl, bs] = best(S.me.st);
    const right = S.logged
      ? `<dl class="stats"><div><dt>Estrellas (${LANGS[bl]})</dt><dd><span class="star">★</span> ${fmt(bs)}</dd></div><div><dt>Resueltos</dt><dd>${S.me.dias} de 24</dd></div><div><dt>Racha</dt><dd>7 días</dd></div></dl>`
      : `<div class="login-inline"><p class="muted small">Entra para guardar tus estrellas y tu racha</p>${oauthButtons(true)}</div>`;
    return `<div class="screen-head"><div><h1>Diciembre en el taller</h1><p class="muted">Hoy es sábado 12 de diciembre. El siguiente ticket se abre mañana a las 6:00.</p></div>${right}</div>`;
  }
  function capText(d, e) {
    if (e === "bloqueado") return ico("lock");
    if (e === "hecho") return `<span class="star">${d.dif ? "★".repeat(d.dif) : ico("check")}</span>`;
    if (e === "hoy") return "Hoy";
    if (e === "pendiente") return "Sin resolver";
    return "";
  }
  const ESTADO_TXT = { hecho: "resuelto", hoy: "ticket de hoy", pendiente: "sin resolver", disponible: "disponible", bloqueado: "bloqueado" };
  function opener(d, e, cls) {
    const label = `Día ${d.n}, ${LVL[d.dif][0]}, ${ESTADO_TXT[e]}`;
    return e === "hoy"
      ? [`<a class="${cls}" href="#ticket" aria-label="${label}">`, "</a>"]
      : [`<button type="button" class="${cls}" data-action="day" data-n="${d.n}" aria-label="${label}">`, "</button>"];
  }
  const SPAN = { 1: "sp-big", 12: "sp-big", 18: "sp-big", 4: "sp-tall", 9: "sp-wide", 24: "sp-banner" };
  function postales() {
    const tiles = DIAS.map((d) => {
      const e = estado(d.n);
      const [o, c] = opener(d, e, `tile is-${e} ${SPAN[d.n] || ""} d${d.n}`);
      const body = d.n === 24
        ? `${bannerArt()}<span class="banner-txt"><b>Nochebuena</b></span>`
        : art(d);
      const cap = capText(d, e);
      const t = `${o}${body}<span class="tile-n">${d.n}</span><span class="tile-lvl">${lvl(d)}</span>${cap ? `<span class="tile-cap">${cap}</span>` : ""}${c}`;
      return d.n === 17 ? `<div class="tile sponsor sp-wide" role="note"><small>Patrocina el taller</small>${molero()}<small>Gracias por hacer posible diciembre</small></div>${t}` : t;
    }).join("");
    return `<div class="post-grid">${tiles}</div>`;
  }
  function puertas() {
    const doors = DIAS.map((d) => {
      const e = estado(d.n);
      const [o, c] = opener(d, e, `door is-${e}`);
      let inner, foot;
      if (e === "hecho") { inner = `<div class="door-art">${art(d)}</div><span class="door-panel" aria-hidden="true"></span>`; foot = d.dif ? `<span class="star">${"★".repeat(d.dif)}</span>` : "Insignia"; }
      else if (e === "bloqueado") { inner = `<span class="door-lock">${ICON.lock}</span>`; foot = `${d.n} dic`; }
      else { inner = `<svg class="door-motif ill" viewBox="0 0 100 100" aria-hidden="true">${ART[MOTIF[d.n]]()}</svg>`; foot = e === "hoy" ? "Hoy" : e === "pendiente" ? "Sin resolver" : "Abrir"; }
      const knob = e === "hecho" ? "" : `<span class="door-knob" aria-hidden="true"></span>`;
      return `${o}${inner}<span class="tile-n">${d.n}</span><span class="tile-lvl">${lvl(d)}</span>${knob}<span class="door-foot">${foot}</span>${c}`;
    }).join("");
    return `<div class="lights" aria-hidden="true"></div><div class="door-grid">${doors}</div>
      <div class="plaque"><span class="muted small">Este taller lo patrocina</span>${molero()}<span class="muted small">Gracias por hacer posible diciembre</span></div>`;
  }
  function estanteria() {
    const WEEKS = [[1, 6], [7, 13], [14, 20], [21, 24]];
    return WEEKS.map(([a, b], wi) => {
      const days = DIAS.slice(a - 1, b);
      const hechos = days.filter((d) => estado(d.n) === "hecho").length;
      const books = days.map((d) => {
        const e = estado(d.n);
        const [o, c] = opener(d, e, `book is-${e}`);
        const meta = e === "hecho" ? (d.dif ? "Hecho " + "★".repeat(d.dif) : "Hecho, insignia") : e === "hoy" ? "Hoy, ábrelo" : e === "pendiente" ? "Sin resolver" : e === "bloqueado" ? `Se abre el ${d.n} dic` : "Disponible";
        return `${o}<span class="book-art">${art(d)}<span class="tile-n">${d.n}</span><span class="tile-lvl">${lvl(d)}</span></span><span class="book-meta">${meta}</span>${c}`;
      }).join("");
      const extra = wi === 3 ? `<div class="book" role="note"><span class="book-art book-plain"><b style="font-family:var(--font-display);font-size:28px">25</b><span class="muted small">Navidad. El taller cierra.</span></span></div>
        <div class="book" role="note"><span class="book-art book-plain"><span class="muted small">Patrocina</span>${molero()}</span></div>` : "";
      return `<section class="shelf"><div class="shelf-head"><h2>Semana ${wi + 1}</h2><span class="muted small">Del ${a} al ${b} de diciembre${S.logged ? `, ${hechos} de ${days.length} hechos` : ""}</span></div>
        <div class="shelf-row">${books}${extra}</div><div class="shelf-board" aria-hidden="true"></div></section>`;
    }).join("");
  }
  function calendario() {
    const body = S.design === "postales" || S.design === "fotos" ? postales() : S.design === "puertas" ? puertas() : estanteria();
    return `<div class="wrap screen">${calHead()}${body}</div>`;
  }

Authorization: Bearer &lt;token de tu cuenta&gt;</pre>

  /* ---------- Perfil ---------- */
  function rankTable() {
    const tab = S.rankTab;
    const rows = GENTE.filter((p) => !p.yo || S.logged).map((p) => {
      const [bl, bs] = best(p.st);
      return { p, l: tab === "general" ? bl : tab, v: tab === "general" ? bs : (p.st[tab] || 0) };
    }).filter((r) => r.v > 0).sort((a, b) => b.v - a.v || b.p.dias - a.p.dias);
    return `<table class="rank"><caption class="sr">Clasificación ${tab === "general" ? "general" : "de " + LANGS[tab]}</caption>
      <thead><tr><th scope="col" class="num">#</th><th scope="col">Persona</th><th scope="col">Lenguaje</th><th scope="col" class="num">Estrellas</th><th scope="col" class="num">Días</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${r.p.yo ? "is-me" : ""}"><td class="num">${i + 1}</td><td><span class="person">${ini(r.p, 32)}<span><b>${esc(r.p.nombre)}${r.p.yo ? " (tú)" : ""}</b><small>@${r.p.usuario}</small></span></span></td><td>${LANGS[r.l]}</td><td class="num"><span class="star">★</span> ${fmt(r.v)}</td><td class="num">${r.p.dias}</td></tr>`).join("")}</tbody></table>`;

  function perfil() {
    const tabs = [["general", "General"], ...Object.entries(LANGS)].map(([k, t]) => `<button type="button" role="tab" data-action="rank" data-tab="${k}" aria-selected="${k === S.rankTab}">${t}</button>`).join("");

      <div class="rank-tabs" role="tablist" aria-label="Filtrar por lenguaje">${tabs}</div><div class="table-wrap" id="rank">${rankTable()}</div></section>`;

      return `<div class="wrap screen profile">

        <div class="profile-main">${ranking}</div></div>`;

          <div><dt>Puntuación</dt><dd><span class="star">★</span> ${fmt(bs)}</dd></div>
          <div><dt>Cuenta</dt><dd>${LANGS[bl]}</dd></div>
          <div><dt>Racha</dt><dd>7 días</dd></div>
          <div><dt>Resueltos</dt><dd>${me.dias} de 24</dd></div>
        </dl>
        <h2>Insignias</h2>
        <ul class="badges">${BADGES.map((b) => `<li class="${b.locked ? "is-locked" : ""}"><span class="b-ico">${ico(b.i)}</span><span><b>${b.n}</b><small>${b.d}</small></span></li>`).join("")}</ul>
        <button type="button" class="btn-link" data-action="logout" style="align-self:flex-start">Cerrar sesión</button>

      <div class="profile-main">
        <section class="card"><h2>Estrellas por lenguaje</h2><p class="muted" style="margin-top:6px">Solo cuenta tu mejor lenguaje. Ahora mismo es ${LANGS[bl]}.</p><ul class="langbars">${bars}</ul></section>

      </div></div>`;
  }

  /* ---------- Render y rutas ---------- */
  function renderAll() {
    $("#app-header").innerHTML = header();
    $("#s-calendario").innerHTML = calendario();
    $("#s-ticket").innerHTML = ticket();
    $("#s-perfil").innerHTML = perfil();
    $("#s-como").innerHTML = como();
    $("#foot").innerHTML = footer();
    markNav();
  }
  const ROUTES = ["calendario", "ticket", "perfil", "como"];
  const current = () => { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : "calendario"; };
  function markNav() {
    const r = current();
    document.querySelectorAll("[data-route]").forEach((a) => { if (a.dataset.route === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  }
  function route(scroll) {
    const r = current();
    document.querySelectorAll("[data-screen]").forEach((s) => { s.hidden = s.dataset.screen !== r; });
    markNav();
    if (scroll) window.scrollTo(0, 0);
  }
  function rerender() { const y = window.scrollY; renderAll(); route(false); window.scrollTo(0, y); }

  /* ---------- Diseño y paleta ---------- */
  function fillSelects() {
    $("#sel-design").innerHTML = Object.entries(DISENOS).map(([k, t]) => `<option value="${k}"${k === S.design ? " selected" : ""}>${t}</option>`).join("");
    $("#sel-palette").innerHTML = Object.entries(PALETAS).map(([k, p]) => `<option value="${k}"${k === S.palette ? " selected" : ""}>${p.nombre}${p.scheme === "dark" ? " (oscura)" : ""}</option>`).join("");
  }
  function applyPalette() {
    const p = PALETAS[S.palette];
    KEYS.forEach((k, i) => root.style.setProperty("--" + k, p.v[i]));
    root.style.colorScheme = p.scheme;
    $("#swatches").innerHTML = [0, 6, 18, 20, 21, 22].map((i) => `<span style="background:${p.v[i]}"></span>`).join("");
  }

  /* ---------- Acceso ---------- */
  function openLogin(msg) {
    S.lastFocus = document.activeElement;
    const m = $("#login");
    m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <button type="button" class="modal-x" data-action="close" aria-label="Cerrar">×</button>
      <h2 id="login-title">Entra en el taller</h2>

  function closeLogin() {
    $("#login").hidden = true;
    if (S.lastFocus && document.body.contains(S.lastFocus)) S.lastFocus.focus();

  /* ---------- Tests simulados ---------- */
  function paintResults() { const el = $("#results"); if (el) el.innerHTML = resultsHTML(); }
  function runTests() {
    if (S.running) return;
    S.running = true; S.runs++; S.results = []; S.summary = "";
    const pass = S.runs >= 2, lang = S.lang;
    const btn = $("#run"); if (btn) { btn.disabled = true; btn.textContent = "Ejecutando tests…"; }
    paintResults();
    const delay = reduceMotion() ? 0 : 380;
    TESTS.forEach((name, i) => {
      setTimeout(() => {
        const ok = pass || i !== 3;
        S.results.push({ name, ok, msg: ok ? "" : "Esperaste 200 ms, pero la API pidió 2 s con Retry-After: 2." });
        paintResults();
        if (i === TESTS.length - 1) finish(pass, lang);
      }, delay * (i + 1));
    });
  }
  function finish(pass, lang) {
    S.running = false;
    if (pass) {
      const first = !S.closed, gain = S.hint ? 1.5 : 2;
      if (first) { S.closed = true; S.me.st[lang] = (S.me.st[lang] || 0) + gain; S.me.dias++; }
      S.summaryOk = true;
      S.summary = first ? `5 de 5. Ticket NP-012 cerrado: +${fmt(gain)} estrellas en ${LANGS[lang]}.` : "5 de 5. El ticket ya estaba cerrado.";
      rerender();
      if (first) toast("NP-012 cerrado. El calendario y tu perfil ya lo reflejan.");
    } else {
      S.summaryOk = false;
      S.summary = "4 de 5 tests pasan. Corrige el que falla y vuelve a ejecutar.";
      paintResults();
      const btn = $("#run"); if (btn) { btn.disabled = false; btn.textContent = "Ejecutar tests"; }
    }
  }
  let toastT = 0;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800);
  }
  const saveCode = () => { const ta = $("#code"); if (ta) S.code[S.lang] = ta.value; };

  /* ---------- Eventos ---------- */
  document.addEventListener("click", (e) => {
    if (e.target.id === "login") { closeLogin(); return; }
    const el = e.target.closest("[data-action]"); if (!el) return;
    const a = el.dataset.action;
    if (a === "login") openLogin();
    else if (a === "close") closeLogin();
    else if (a === "oauth") {
      saveCode();
      S.logged = true; S.prov = el.dataset.prov;
      $("#login").hidden = true;
      rerender();
      toast(`Has entrado con ${S.prov} como ${S.me.nombre}.`);
    } else if (a === "logout") {
      saveCode(); S.logged = false; S.prov = ""; rerender(); toast("Has cerrado sesión.");
    } else if (a === "day") {
      const d = DIAS[Number(el.dataset.n) - 1], st = estado(d.n);
      if (st === "bloqueado") toast(`El día ${d.n} se abre el ${d.n} de diciembre a las 6:00.`);
      else if (d.tipo === "mini") toast(`Minijuego del día ${d.n}: en el prototipo no está montado.`);
      else toast(`En el prototipo solo está abierto el ticket de hoy, NP-012.`);
    } else if (a === "lang") {
      saveCode();
      S.lang = el.dataset.lang;
      const ta = $("#code"); if (ta) ta.value = codeFor(S.lang);
      document.querySelectorAll('[data-action="lang"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
      const f = $("#f-scores"); if (f) f.textContent = LANGS[S.lang];
    } else if (a === "reset") {
      S.code[S.lang] = null; const ta = $("#code"); if (ta) ta.value = codeFor(S.lang);
    } else if (a === "run") {
      saveCode();
      if (!S.logged) { openLogin("Inicia sesión para ejecutar los tests y que cuenten tus estrellas."); return; }
      runTests();
    } else if (a === "hint") {
      S.hint = true; el.disabled = true; const m = document.querySelector(".mentor"); if (m) m.hidden = false;
    } else if (a === "rank") {
      S.rankTab = el.dataset.tab; $("#rank").innerHTML = rankTable();
      document.querySelectorAll('[data-action="rank"]').forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.rankTab)));
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "code") S.code[S.lang] = e.target.value; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#login").hidden) { closeLogin(); return; }
    if (e.target.id === "code" && e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4; S.code[S.lang] = ta.value;
    }
  });
  $("#sel-design").addEventListener("change", (e) => {
    saveCode(); S.design = e.target.value; root.dataset.design = S.design; store.set("np.design2", S.design); rerender();
  });
  $("#sel-palette").addEventListener("change", (e) => {
    S.palette = e.target.value; store.set("np.palette2", S.palette); applyPalette();
  });
  window.addEventListener("hashchange", () => route(true));

  root.dataset.design = S.design;
  fillSelects(); applyPalette(); renderAll(); route(false);
})();
</script>
