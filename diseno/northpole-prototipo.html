<title>DevAdviento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Young+Serif&display=swap">
<style>
/* Layout: página ancha (1440px) con panel lateral fijo a la izquierda y calendario a la derecha; en móvil el panel va encima.
   Paleta única Nochebuena (oscura), la misma que usa la app. */
:root{
  color-scheme: dark;
  --bg:#7A1424; --surface:#8A1D2F; --surface-2:#962838; --fg:#FBEFE3; --muted:#EEC9C2; --line:#A63A4A;
  --primary:#F6DDB0; --primary-fg:#5A0F1A; --primary-deep:#DDBB85; --glow:#FFB648; --star:#FFD36B;
  --snow:#FFF6EC; --ink:#22070C; --ok:#A6E3AE; --garland-a:#FFB648; --garland-b:#E2483D;
  --easy-bg:#9BE3A5; --easy-fg:#0E3A18; --medium-bg:#FFD36B; --medium-fg:#4A3000; --hard-bg:#FF8F86; --hard-fg:#5A0D0D; --extra-bg:#C9D4FF; --extra-fg:#1C2A66;
  --js:#F7DF1E; --js-fg:#1F1B00; --ts:#3178C6; --ts-fg:#FFFFFF; --py:#3776AB; --py-fg:#FFD43B;
  --font-display:"Young Serif", Georgia, serif; --font-body:"Figtree", system-ui, sans-serif; --font-mono:"JetBrains Mono", ui-monospace, monospace;
  --radius:14px; --radius-lg:20px; --wide:1440px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.wrap{max-width:var(--wide);margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.muted{color:var(--muted)}
.star{color:var(--star)}

/* Barra del prototipo */
.proto{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.proto strong{color:var(--fg);margin-right:auto}
.proto label{display:flex;align-items:center;gap:6px}
.proto select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

/* Cabecera de la app */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.header::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;pointer-events:none;
  background:radial-gradient(circle at 12px 9px,var(--garland-a) 4px,transparent 4.5px) 0 0/56px 16px,radial-gradient(circle at 40px 9px,var(--garland-b) 4px,transparent 4.5px) 0 0/56px 16px,linear-gradient(var(--line),var(--line)) 0 8px/100% 1.5px no-repeat}
.header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;min-height:64px;padding-block:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:20px;text-decoration:none}
.logo svg{width:22px;height:22px;fill:var(--primary)}
.tabs{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;text-decoration:none;white-space:nowrap}
.tab[aria-current="page"]{background:var(--primary);color:var(--primary-fg)}
.me{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.pill-score{padding:5px 10px;border-radius:999px;background:var(--surface-2)}
.avatar{width:var(--s,34px);height:var(--s,34px);border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--primary);color:var(--primary-fg);font-weight:800;font-size:calc(var(--s,34px)*.38)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.7em 1.2em;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-sm{font-size:14px;padding:.55em 1em}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-github{background:#24292F;color:#FFFFFF}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn-block{width:100%}
@media (max-width:760px){.tabs{order:3;flex-basis:100%}.me,.header .btn{margin-left:auto}}

/* Página: panel lateral + calendario */
.page{display:grid;grid-template-columns:420px minmax(0,1fr);gap:36px;align-items:start;padding-block:36px 72px}
/* El panel se desplaza con la página: un solo scroll, sin barra propia. */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1180px){.page{grid-template-columns:1fr;gap:24px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;min-width:0}
.card h2{font-size:20px;margin-bottom:12px}
.seo h1{font-size:clamp(1.9rem,2.6vw,2.5rem)}
.seo p{margin-top:10px;color:var(--muted)}
.seo-compact h1{font-size:24px}
.seo-compact p{font-size:14px}

/* Lenguajes */
.langs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.langs li{display:flex;align-items:center;gap:12px}
.langs li > span:last-child{display:flex;flex-direction:column;line-height:1.25}
.langs small{color:var(--muted);font-size:12.5px}
.lang-badge{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font:500 13px/1 var(--font-mono);flex:none}
.lang-js{background:var(--js);color:var(--js-fg)} .lang-ts{background:var(--ts);color:var(--ts-fg)} .lang-py{background:var(--py);color:var(--py-fg)}
.lang-row{display:flex;flex-wrap:wrap;gap:8px}
.lang-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px}
.lang-chip .lang-badge{width:26px;height:26px;border-radius:999px;font-size:11px}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.facts div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:800;font-size:17px}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.steps b{display:block;font-size:15px}
.steps span.n{font-family:var(--font-display);font-size:24px;line-height:1;color:var(--primary)}
.sponsor-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.molero{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:20px;color:var(--fg)}
.molero i{width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-style:normal;font-size:15px}

/* Cuenta atrás y ticket de hoy */
.countdown{font:400 clamp(2.4rem,3.4vw,3rem)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.countdown-units{display:grid;grid-template-columns:repeat(3,1fr);margin-top:6px;font-size:12px;color:var(--muted)}
.today-card{display:flex;flex-direction:column;gap:12px}
.today-head{display:flex;gap:12px;align-items:center}
.today-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface-2)}
.today-head b{font-family:var(--font-display);font-weight:400;font-size:17px;line-height:1.2;display:block}
.today-head small{color:var(--muted)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}

/* Etiqueta de dificultad */
.lvl{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font:800 11.5px/1 var(--font-body);white-space:nowrap}
.lvl i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28;display:inline-block}
.lvl i.on{opacity:1}
.pips{display:inline-flex;gap:2px}
.lvl-easy{background:var(--easy-bg);color:var(--easy-fg)} .lvl-medium{background:var(--medium-bg);color:var(--medium-fg)} .lvl-hard{background:var(--hard-bg);color:var(--hard-fg)} .lvl-extra{background:var(--extra-bg);color:var(--extra-fg)}

/* Progreso */
.me-head{display:flex;gap:14px;align-items:center}
.me-head b{font-family:var(--font-display);font-weight:400;font-size:20px;display:block}
.big-score{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.big-score strong{font:400 40px/1 var(--font-display)}
.bars{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.bars .lang-badge{width:28px;height:28px;border-radius:7px;font-size:11px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.dots span{aspect-ratio:1;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.dots .d-done{background:var(--ok);color:var(--easy-fg)}
.dots .d-pending{background:transparent;box-shadow:inset 0 0 0 2px var(--medium-bg);color:var(--medium-bg)}
.dots .d-mini{background:var(--extra-bg);color:var(--extra-fg)}
.dots .d-today{background:var(--glow);color:var(--ink)}
.dots .d-locked{opacity:.45}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend-row span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.mini-stats div{display:flex;flex-direction:column}
.mini-stats dt{font-size:12px;color:var(--muted)}
.mini-stats dd{margin:0;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}

/* Clasificación */
.rank-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rank-tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer}
.rank-tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto;gap:10px;align-items:center;height:48px;border-bottom:1px solid var(--line);font-size:14px}
.rank li:last-child{border-bottom:0}
.rank .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;text-align:right}
.rank .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.rank .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who small{color:var(--muted)}
.rank .pts{font-weight:800;font-variant-numeric:tabular-nums}
.rank .is-me{background:color-mix(in srgb,var(--primary) 12%,transparent);border-radius:10px;padding-inline:6px;margin-inline:-6px}
.rank .gap{height:22px;border:0;color:var(--muted);font-size:13px;display:flex;justify-content:center}
.medal-1 .pos{color:var(--star)} .medal-2 .pos{color:#DDE3EA} .medal-3 .pos{color:#E7A86B}

/* Calendario */
.cal-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;margin-bottom:22px}
.cal-head h2{font-size:clamp(1.7rem,2.6vw,2.3rem)}
.cal-head p{margin-top:6px}
.stats{display:flex;gap:8px 28px;flex-wrap:wrap;margin:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(120px,10.5vw,158px);gap:14px}
.tile{position:relative;display:block;overflow:hidden;border-radius:var(--radius);background:var(--surface-2);color:var(--snow);text-decoration:none;box-shadow:0 0 0 4px var(--surface),0 10px 22px -12px color-mix(in srgb,var(--ink) 80%,transparent);transition:transform .15s}
a.tile:hover{transform:translateY(-3px)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--ink) 50%,transparent),transparent 34%,transparent 66%,color-mix(in srgb,var(--ink) 45%,transparent))}
.num{position:absolute;top:8px;left:8px;z-index:1;min-width:36px;height:36px;padding:0 9px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--ink) 62%,transparent);font:400 21px/1 var(--font-display)}
.tile .lvl{position:absolute;top:10px;right:10px;z-index:1}
.status{position:absolute;right:8px;bottom:8px;z-index:1;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 70%,transparent);font-size:13px;font-weight:800;line-height:1}
.status svg{width:13px;height:13px;fill:currentColor}
.locked img{filter:grayscale(1) brightness(.9);opacity:.5}
.today{box-shadow:0 0 0 4px var(--glow),0 0 34px 4px color-mix(in srgb,var(--glow) 70%,transparent)}
.big{grid-column:span 2;grid-row:span 2} .big .num{min-width:46px;height:46px;font-size:30px}
.tall{grid-row:span 2} .wide,.sponsor{grid-column:span 2} .banner{grid-column:1/-1}
.sponsor{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--radius);background:var(--surface);text-align:center;box-shadow:0 0 0 4px var(--surface)}
.sponsor small{color:var(--muted);font-size:12.5px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:150px}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;grid-auto-rows:156px;gap:12px}.big{grid-row:auto}.single-mobile,.wide,.tall,.banner{grid-column:auto;grid-row:auto}.big .num{min-width:36px;height:36px;font-size:21px}}

/* Variantes limpias: titular grande + índice de los 24 días */
.hero{padding-block:8px 6px}
.hero-title{font:400 clamp(2.6rem,3.6vw,3.5rem)/1.02 var(--font-display);letter-spacing:-.01em}
.hero-sub{font-size:17px;color:var(--muted);margin-top:14px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}
.lang-icons{display:flex;gap:8px}
.lang-icons .lang-badge{width:40px;height:40px;border-radius:10px;font-size:14px}
.index-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.index-head h2{margin:0}
.index-head span{font-size:13px}
.day-index{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ix{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:block;text-decoration:none;color:var(--snow);background:var(--surface-2);transition:transform .12s}
.ix:hover{transform:translateY(-2px)}
.ix img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ix::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--ink) 70%,transparent),transparent 60%)}
.ix span{position:absolute;left:6px;bottom:4px;z-index:1;font:400 15px/1 var(--font-display)}
.ix b{position:absolute;right:5px;top:5px;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--ok);color:var(--easy-fg);font-size:11px;display:grid;place-items:center}
.ix-locked img{filter:grayscale(1);opacity:.45}
.ix-today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--glow)}
.ixn{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;position:relative;text-decoration:none;font:400 18px/1 var(--font-display);transition:transform .12s}
.ixn:hover{transform:translateY(-2px)}
.ixn-easy{background:var(--easy-bg);color:var(--easy-fg)} .ixn-medium{background:var(--medium-bg);color:var(--medium-fg)}
.ixn-hard{background:var(--hard-bg);color:var(--hard-fg)} .ixn-extra{background:var(--extra-bg);color:var(--extra-fg)}
.ixn.is-locked{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 2px var(--lvl-line)}
.ixn-easy.is-locked{--lvl-line:var(--easy-bg)} .ixn-medium.is-locked{--lvl-line:var(--medium-bg)} .ixn-hard.is-locked{--lvl-line:var(--hard-bg)} .ixn-extra.is-locked{--lvl-line:var(--extra-bg)}
.ixn.is-today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--glow)}
.ixn b{position:absolute;right:4px;top:4px;font:800 10px/1 var(--font-body)}
.level-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.level-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.essential-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.essential-line strong{font:400 26px/1 var(--font-display);color:var(--fg);font-variant-numeric:tabular-nums}
.tile{scroll-margin-top:110px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--glow);padding-left:10px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="proto">
  <div class="wrap">

    <label for="sel-variant">Panel lateral <select id="sel-variant"></select></label>

</div>
<header class="header" id="header"></header>
<main class="wrap page" id="page"></main>

    { n: "Omar Haddad", u: "omarh", st: { py: 15 } },
    { n: "Iker Sanz", u: "ikersanz", st: { ts: 14, js: 11 } },
    { n: "Lucía Ferrer", u: "luferrer", st: { py: 14, js: 9 } },
    { n: "Marta Ríos", u: "martarios", st: { py: 12 } },
    { n: "Daniel Ortega", u: "dortega", st: { ts: 12, js: 5 } },
    { n: "Sofía Calvo", u: "sofiacalvo", st: { js: 11, py: 4 } },
    { n: "Pau Vidal", u: "pauvidal", st: { ts: 10 } },
  ];
  const SHAPE = { 1: "big", 4: "tall", 9: "wide", 12: "big", 18: "big single-mobile", 24: "banner" };

  const VARIANTS = {
    presentacion: { name: "1. Presentación (palabras clave)", render: sidePresentation },
    cuenta: { name: "2. Cuenta atrás y ticket de hoy", render: sideCountdown },
    progreso: { name: "3. Tu progreso", render: sideProgress },
    clasificacion: { name: "4. Clasificación en vivo", render: sideRanking },
    todo: { name: "5. Todo en uno (compacto)", render: sideAllInOne },
    "indice-fotos": { name: "6. Limpio: titular + índice con fotos", render: sideIndexPhotos },
    "indice-niveles": { name: "7. Limpio: titular + índice por dificultad", render: sideIndexLevels },
    esencial: { name: "8. Limpio: solo lo esencial", render: sideEssential },
  };

  const S = {
    variant: VARIANTS[store.get("da.variant")] ? store.get("da.variant") : "presentacion",
    signedIn: store.get("da.session") !== "out",
    rankTab: "general",
  };

  /* ---------- Piezas ---------- */
  const STAR_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L19 13 L30 16 L19 19 L16 30 L13 19 L2 16 L13 13Z"/></svg>';
  const GH = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
  const LOCK = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="8.5" rx="2"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  const photo = (d) => `fotos/dia-${String(d).padStart(2, "0")}.jpg`;
  const lvl = (level) => `<span class="lvl lvl-${level}">${PIPS[level] ? `<span class="pips" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= PIPS[level] ? "on" : ""}"></i>`).join("")}</span>` : ""}${LEVEL_LABEL[level]}</span>`;
  const best = (st) => Object.entries(st).sort((a, b) => b[1] - a[1])[0] || ["py", 0];
  const langName = (id) => (LANGS.find((l) => l.id === id) || {}).name || id;
  const initials = (n) => n.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const loginBtn = (cls = "") => `<button type="button" class="btn btn-github ${cls}" data-action="login">${GH}Entrar con GitHub</button>`;
  const todayBtn = (cls = "") => `<a class="btn btn-primary ${cls}" href="#ticket">Abrir el ticket de hoy</a>`;
  const molero = () => `<span class="molero"><i aria-hidden="true">M</i>Molero</span>`;

  const seoBlock = (compact) => `<div class="${compact ? "seo-compact" : "seo"}">
      <h1>Calendario de adviento de programación</h1>
      <p>24 retos del 1 al 24 de diciembre: integra APIs, conecta un modelo de IA y resuelve algoritmos desde el navegador.</p>
    </div>`;
  const langList = () => `<ul class="langs">${LANGS.map((l) => `<li><span class="lang-badge lang-${l.id}" aria-hidden="true">${l.short}</span><span><b>${l.name}</b><small>${l.note}</small></span></li>`).join("")}</ul>`;
  const langChips = () => `<div class="lang-row">${LANGS.map((l) => `<span class="lang-chip"><span class="lang-badge lang-${l.id}" aria-hidden="true">${l.short}</span>${l.name}</span>`).join("")}</div>`;
  const facts = () => `<dl class="facts"><div><dt>Tickets</dt><dd>24</dd></div><div><dt>Al día</dt><dd>10–30 min</dd></div><div><dt>Precio</dt><dd>Gratis</dd></div></dl>`;

  function msToNextSix() {
    const now = new Date();
    const madrid = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Madrid" }));
    const next = new Date(madrid);
    next.setHours(6, 0, 0, 0);
    if (next <= madrid) next.setDate(next.getDate() + 1);
    return next - madrid;
  }
  const fmtCountdown = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return [h, m, sec].map((v) => String(v).padStart(2, "0")).join(":"); };
  const countdownCard = () => `<section class="card" aria-live="off">
      <h2>Siguiente ticket en</h2>
      <div class="countdown" data-countdown>${fmtCountdown(msToNextSix())}</div>
      <div class="countdown-units"><span>horas</span><span>minutos</span><span>segundos</span></div>
      <p class="muted" style="margin-top:10px;font-size:14px">El día 13 se abre mañana a las 6:00 (hora de España).</p>
    </section>`;
  const todayCard = () => `<section class="card today-card">
      <h2 style="margin:0">Ticket de hoy</h2>
      <div class="today-head"><img class="today-thumb" src="${photo(TODAY)}" alt="" style="background:${COLORS[TODAY - 1]}"><span><small>NP-0${TODAY}</small><b>${TODAY_TITLE}</b></span></div>
      <div class="meta-row">${lvl(LEVEL[TODAY - 1])}<span>Integración API</span><span>unos ${MINUTES[LEVEL[TODAY - 1]]} min</span></div>
      ${S.signedIn ? todayBtn("btn-block") : loginBtn("btn-block")}
    </section>`;

  function rankRows(tab, limit) {
    const all = PEOPLE.map((p) => ({ ...p })).concat([{ n: ME.name, u: ME.name, st: ME.stars, me: true }]);
    const scored = all.map((p) => { const [l, v] = tab === "general" ? best(p.st) : [tab, p.st[tab] || 0]; return { ...p, lang: l, val: v }; })
      .filter((p) => p.val > 0).sort((a, b) => b.val - a.val);
    const rows = scored.slice(0, limit).map((p, i) => row(p, i + 1));
    const meIndex = scored.findIndex((p) => p.me);
    if (S.signedIn && meIndex >= limit) rows.push('<li class="gap" aria-hidden="true">···</li>', row(scored[meIndex], ME.position));
    return rows.join("");
    function row(p, pos) {
      if (p.me && !S.signedIn) return "";
      return `<li class="${p.me ? "is-me" : ""} ${pos <= 3 ? `medal-${pos}` : ""}"><span class="pos">${pos}</span><span class="avatar" style="--s:30px">${initials(p.n)}</span><span class="who"><b>${esc(p.n)}${p.me ? " (tú)" : ""}</b><small>${langName(p.lang)}</small></span><span class="pts"><span class="star">★</span> ${p.val}</span></li>`;
    }
  }
  const rankingCard = (limit, withTabs) => `<section class="card">
      <h2>Clasificación</h2>
      ${withTabs ? `<div class="rank-tabs" role="group" aria-label="Filtrar por lenguaje">${[["general", "General"], ...LANGS.map((l) => [l.id, l.name])].map(([k, t]) => `<button type="button" data-action="rank" data-tab="${k}" aria-pressed="${k === S.rankTab}">${t}</button>`).join("")}</div>` : ""}
      <ol class="rank" id="rank">${rankRows(withTabs ? S.rankTab : "general", limit)}</ol>
      <a href="#perfil" class="muted" style="display:inline-block;margin-top:10px;font-size:13px">Ver la clasificación completa</a>
    </section>`;

  /* ---------- Las 5 variantes del panel ---------- */
  function sidePresentation() {
    return `${seoBlock(false)}
      ${S.signedIn ? todayBtn("btn-block") : loginBtn("btn-block")}
      <section class="card"><h2>Lenguajes</h2>${langList()}</section>
      ${facts()}
      <section class="card"><h2>Cómo funciona</h2><ol class="steps">
        <li><span class="n">1</span><span><b>A las 6:00 se abre un ticket</b>Trabajo de empresa real: APIs, IA y datos.</span></li>
        <li><span class="n">2</span><span><b>Lo resuelves en tu lenguaje</b>En el navegador, con tu IA de siempre si quieres.</span></li>
        <li><span class="n">3</span><span><b>Cuenta tu mejor lenguaje</b>Las estrellas de ese lenguaje son tu puntuación.</span></li>
      </ol></section>
      <p class="sponsor-line">Un proyecto de ${molero()}</p>`;
  }
  function sideCountdown() {
    return `${seoBlock(true)}
      ${countdownCard()}
      ${todayCard()}
      <section class="card"><h2>Resuélvelo en</h2>${langChips()}</section>
      <p class="sponsor-line">Un proyecto de ${molero()}</p>`;
  }
  function sideProgress() {
    if (!S.signedIn) {
      return `${seoBlock(true)}
        <section class="card"><h2>Tu progreso</h2><p class="muted" style="margin-bottom:14px">Entra para guardar tus estrellas, tu racha y tus insignias, y salir en la clasificación.</p>${loginBtn("btn-block")}</section>
        <section class="card"><h2>Lenguajes</h2>${langList()}</section>`;
    }
    const [bl, bs] = best(ME.stars);
    const max = Math.max(15, ...Object.values(ME.stars));
    const dots = Array.from({ length: 24 }, (_, i) => {
      const d = i + 1;
      const cls = d === TODAY ? "d-today" : DONE[d] ? "d-done" : MINI_DONE.includes(d) ? "d-mini" : PENDING.includes(d) ? "d-pending" : d > TODAY ? "d-locked" : "";
      return `<span class="${cls}" title="Día ${d}">${d}</span>`;
    }).join("");
    return `<section class="card">
        <div class="me-head"><span class="avatar" style="--s:52px">${ME.initials}</span><span><b>${ME.name}</b><span class="muted" style="font-size:13px">Puesto ${ME.position} de 1.284</span></span></div>
        <div class="big-score"><strong><span class="star">★</span> ${bs}</strong><span class="muted">en ${langName(bl)}</span></div>
        <dl class="mini-stats" style="margin-top:14px"><div><dt>Resueltos</dt><dd>${ME.solved} de 24</dd></div><div><dt>Racha</dt><dd>${ME.streak} días</dd></div><div><dt>Insignias</dt><dd>3</dd></div></dl>
      </section>
      <section class="card"><h2>Estrellas por lenguaje</h2><ul class="bars">${LANGS.map((l) => `<li><span class="lang-badge lang-${l.id}" aria-hidden="true">${l.short}</span><span class="bar"><i style="width:${((ME.stars[l.id] || 0) / max) * 100}%"></i></span><span class="val">★ ${ME.stars[l.id] || 0}</span></li>`).join("")}</ul>
        <p class="muted" style="font-size:13px;margin-top:10px">Solo cuenta tu mejor lenguaje: ahora ${langName(bl)}.</p></section>
      <section class="card"><h2>Tu diciembre</h2><div class="dots">${dots}</div>
        <div class="legend-row"><span style="--c:var(--ok)">Hecho</span><span style="--c:var(--glow)">Hoy</span><span style="--c:var(--medium-bg)">Sin resolver</span><span style="--c:var(--extra-bg)">Minijuego</span></div></section>
      ${todayBtn("btn-block")}`;
  }
  function sideRanking() {
    return `${seoBlock(true)}
      ${langChips()}
      ${rankingCard(8, true)}
      ${S.signedIn ? todayBtn("btn-block") : loginBtn("btn-block")}`;
  }
  function sideAllInOne() {
    return `${seoBlock(true)}
      ${langChips()}
      <section class="card">
        <div class="today-head"><img class="today-thumb" src="${photo(TODAY)}" alt="" style="background:${COLORS[TODAY - 1]}"><span><small>Hoy · NP-0${TODAY}</small><b>${TODAY_TITLE}</b></span></div>
        <div class="meta-row" style="margin-top:10px">${lvl(LEVEL[TODAY - 1])}<span>unos ${MINUTES[LEVEL[TODAY - 1]]} min</span><span>Siguiente en <b data-countdown>${fmtCountdown(msToNextSix())}</b></span></div>
        <div style="margin-top:14px">${S.signedIn ? todayBtn("btn-block") : loginBtn("btn-block")}</div>
      </section>
      ${rankingCard(3, false)}
      <p class="sponsor-line">Un proyecto de ${molero()}</p>`;
  }

  /* ---------- Variantes limpias: titular grande, botón con lenguajes e índice de los 24 días ---------- */
  const DAY_LIST = Array.from({ length: 24 }, (_, i) => i + 1);
  function dayState(d) {
    if (d > TODAY) return "locked";
    if (d === TODAY) return "today";
    if (S.signedIn && (DONE[d] || MINI_DONE.includes(d))) return "done";
    return "open";
  }
  const hero = () => `<div class="hero">
      <h1 class="hero-title">Calendario de adviento de programación</h1>
      <p class="hero-sub">24 retos de trabajo real antes de Navidad.</p>
      <div class="cta-row">${S.signedIn ? todayBtn() : loginBtn()}
        <span class="lang-icons" role="img" aria-label="Lenguajes: JavaScript, TypeScript y Python">${LANGS.map((l) => `<span class="lang-badge lang-${l.id}" title="${l.name}">${l.short}</span>`).join("")}</span>
      </div>
    </div>`;
  const indexHead = () => `<div class="index-head"><h2>Los 24 retos</h2>${S.signedIn ? `<span class="muted">${ME.solved} de 24 hechos</span>` : ""}</div>`;

  function sideIndexPhotos() {
    const items = DAY_LIST.map((d) => {
      const state = dayState(d);
      return `<a href="#dia-${d}" class="ix ix-${state}" aria-label="Ir al día ${d}"><img src="${photo(d)}" alt="" loading="lazy" style="background:${COLORS[d - 1]}"><span>${d}</span>${state === "done" ? '<b aria-hidden="true">✓</b>' : ""}</a>`;
    }).join("");
    return `${hero()}<section class="card">${indexHead()}<nav class="day-index" aria-label="Ir a un día">${items}</nav></section>
      <p class="sponsor-line">Un proyecto de ${molero()}</p>`;
  }
  function sideIndexLevels() {
    const items = DAY_LIST.map((d) => {
      const state = dayState(d);
      const cls = `ixn ixn-${LEVEL[d - 1]} ${state === "locked" ? "is-locked" : ""} ${state === "today" ? "is-today" : ""}`;
      return `<a href="#dia-${d}" class="${cls}" aria-label="Ir al día ${d}, ${LEVEL_LABEL[LEVEL[d - 1]]}">${d}${state === "done" ? '<b aria-hidden="true">✓</b>' : ""}</a>`;
    }).join("");
    const legend = ["easy", "medium", "hard", "extra"].map((k) => `<span style="--c:var(--${k}-bg)">${LEVEL_LABEL[k]}</span>`).join("");
    return `${hero()}<section class="card">${indexHead()}<nav class="day-index" aria-label="Ir a un día">${items}</nav><div class="level-legend">${legend}</div></section>
      <p class="sponsor-line">Un proyecto de ${molero()}</p>`;
  }
  function sideEssential() {
    return `${hero()}
      <div class="essential-line"><span>Siguiente ticket en</span><strong data-countdown>${fmtCountdown(msToNextSix())}</strong></div>
      <p class="sponsor-line" style="margin-top:8px">Un proyecto de ${molero()}</p>`;
  }

  /* ---------- Cabecera y calendario ---------- */
  function header() {
    const [, bs] = best(ME.stars);
    const right = S.signedIn
      ? `<span class="me"><span class="pill-score"><span class="star">★</span> ${bs}</span><span class="avatar">${ME.initials}</span>${ME.name}</span>`
      : loginBtn("btn-sm");
    return `<div class="wrap"><a class="logo" href="#">${STAR_SVG}DevAdviento</a>
      <nav class="tabs" aria-label="Secciones"><a class="tab" href="#" aria-current="page">Calendario</a><a class="tab" href="#ticket">Ticket de hoy</a><a class="tab" href="#perfil">Perfil</a><a class="tab" href="#como">Cómo funciona</a></nav>${right}</div>`;
  }
  function status(d) {
    if (d > TODAY) return `<span class="status" aria-hidden="true">${LOCK}</span>`;
    if (LEVEL[d - 1] === "extra") return `<span class="status">${S.signedIn && MINI_DONE.includes(d) ? "Insignia" : "Minijuego"}</span>`;
    if (S.signedIn && DONE[d]) return `<span class="status"><span class="star">${"★".repeat(STARS[DONE[d]])}</span></span>`;
    if (d === TODAY) return `<span class="status">Hoy</span>`;
    if (S.signedIn) return `<span class="status">Sin resolver</span>`;
    return "";
  }
  function calendar() {
    const tiles = Array.from({ length: 24 }, (_, i) => {
      const d = i + 1, level = LEVEL[i];
      const cls = ["tile", SHAPE[d] || "", d > TODAY ? "locked" : "", d === TODAY ? "today" : ""].join(" ");
      const tag = d > TODAY ? "div" : "a";
      const tile = `<${tag} id="dia-${d}" class="${cls}" ${tag === "a" ? 'href="#ticket"' : ""} aria-label="Día ${d}, ${LEVEL_LABEL[level]}"><img src="${photo(d)}" alt="" loading="${d <= 5 ? "eager" : "lazy"}" style="background:${COLORS[i]}"><span class="num">${d}</span>${lvl(level)}${status(d)}</${tag}>`;
      return d === 17 ? `<aside class="sponsor"><small>Patrocina el taller</small>${molero()}<small>Gracias por hacer posible diciembre</small></aside>${tile}` : tile;
    }).join("");
    return `<section aria-label="Calendario de diciembre"><div class="grid">${tiles}</div></section>`;
  }

  function render() {
    $("#header").innerHTML = header();
    $("#page").innerHTML = `<aside class="side" aria-label="Panel del calendario">${VARIANTS[S.variant].render()}</aside>${calendar()}`;
  }

  /* ---------- Controles ---------- */
  $("#sel-variant").innerHTML = Object.entries(VARIANTS).map(([k, v]) => `<option value="${k}"${k === S.variant ? " selected" : ""}>${v.name}</option>`).join("");
  $("#sel-session").value = S.signedIn ? "in" : "out";
  $("#sel-variant").addEventListener("change", (e) => { S.variant = e.target.value; store.set("da.variant", S.variant); render(); });
  $("#sel-session").addEventListener("change", (e) => { S.signedIn = e.target.value === "in"; store.set("da.session", e.target.value); render(); });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]"); if (!el) return;
    if (el.dataset.action === "login") { S.signedIn = true; $("#sel-session").value = "in"; store.set("da.session", "in"); render(); }
    if (el.dataset.action === "rank") {
      S.rankTab = el.dataset.tab;
      const list = $("#rank"); if (list) list.innerHTML = rankRows(S.rankTab, 8);
      document.querySelectorAll('[data-action="rank"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === S.rankTab)));
    }
  });
  setInterval(() => { const text = fmtCountdown(msToNextSix()); document.querySelectorAll("[data-countdown]").forEach((n) => { n.textContent = text; }); }, 1000);

  render();
})();
</script>
